name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bridge-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check app/ tests/
      - run: pytest tests/ -q
